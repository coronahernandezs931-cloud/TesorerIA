[workspace]
resolver = "2"
members = ["treasury-guard", "treasury-streams", "treasury-credit", "treasury-mainnet", "treasury-mainnet-ops", "treasury-settlement", "treasury-trade"]

[workspace.dependencies]
soroban-sdk = "29"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
