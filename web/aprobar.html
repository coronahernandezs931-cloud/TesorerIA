<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autorizar pago · TesorerIA</title>
<meta name="theme-color" content="#f2f4f7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ground:#f2f4f7;--surface:#fff;--raised:#eef0f3;--border:#e3e6ea;--rule:#eef0f2;--control:#d0d4da;--text:#0a0a0a;--muted:#5f6670;
  --primary:#141414;--hue:#1d5fbf;--positive:#247b50;--negative:#c4242a;
  --pill-warning-bg:#fffbeb;--pill-warning-ink:#92400e;--pill-positive-bg:#dcfae5;--pill-positive-ink:#04250e;--pill-negative-bg:#ffedea;--pill-negative-ink:#831c1e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--text);font:400 15px/22px "Geist",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:440px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;height:48px}
.top b{font-weight:500}
.top span{color:var(--muted)}
h1{font-size:22px;line-height:28px;font-weight:500;margin:20px 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--pill-warning-bg);color:var(--pill-warning-ink)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--pill-positive-bg);color:var(--pill-positive-ink)}
.pill.bad{background:var(--pill-negative-bg);color:var(--pill-negative-ink)}
.fig{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.02em;margin:14px 0 2px}
.fig small{font-size:16px;font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:0}
.to{font-size:16px;margin:0}
.to span{display:block;color:var(--muted);font-size:13px}
.kv{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--rule)}
.kv li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
.kv li:last-child{border-bottom:0;padding-bottom:0}
.kv li span:first-child{color:var(--muted)}
.kv li span:last-child{margin-left:auto;text-align:right}
.kv a{color:var(--hue);text-decoration:none;font-family:"Geist Mono",monospace;font-size:13px}
.why{margin:16px 0 0;padding:12px 14px;background:var(--raised);border-radius:8px;font-size:14px;line-height:20px}
.actions{margin-top:auto;padding-top:20px;display:grid;gap:10px}
.btn{height:52px;border-radius:10px;border:1px solid var(--control);background:var(--surface);font:500 16px "Geist",system-ui,sans-serif;color:var(--text);cursor:pointer;transition:transform .08s,background .12s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn[disabled]{opacity:.6}
.btn:focus-visible{outline:2px solid var(--hue);outline-offset:2px}
.done{text-align:left}
.done .fig{font-size:28px}
.done a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.err{color:var(--negative)}
.card .err{color:var(--negative)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="#1d5fbf" stroke-width="3"/><path d="M16 4v5M16 23v5M4 16h5M23 16h5" stroke="#1d5fbf" stroke-width="3"/><circle cx="16" cy="16" r="4" fill="#141414"/></svg>
    <b>TesorerIA</b><span>· Grupo Tlahuica</span>
  </div>
  <main id="main"><h1>Autorizar pago</h1><p class="sub">Cargando la solicitud…</p></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const nf2 = new Intl.NumberFormat('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const q = new URLSearchParams(location.search), id = q.get('id'), t = q.get('t');
const EXPL = 'https://stellar.expert/explorer/testnet';
let AP = null;

async function init() {
  const r = await fetch(`/api/approval/${encodeURIComponent(id)}?t=${encodeURIComponent(t)}`);
  if (!r.ok) { $('#main').innerHTML = `<h1>Solicitud no válida</h1><p class="sub">Esta liga ya se usó o no existe.</p>`; return; }
  AP = await r.json();
  if (AP.status !== 'pendiente') return done({already: AP.status});
  const s = AP.supplier_info;
  if (AP.type === 'supplier_change') return fraudView(s);
  $('#main').innerHTML = `
    <h1>Tesa pide tu firma</h1>
    <p class="sub">El contrato retuvo este pago porque supera tu umbral de aprobación.</p>
    <section class="card" aria-label="Detalle del pago">
      <span class="pill"><span class="d"></span>Retenido en la bóveda</span>
      <div class="fig num">${nf2.format(AP.amount)}<small>MXNe</small></div>
      <p class="to">${esc(s.name)}<span>${esc(s.city)} · ${esc(AP.concept)}</span></p>
      <ul class="kv">
        <li><span>Factura</span><span>${esc(AP.invoice || 'Sin factura')}</span></li>
        <li><span>Tu umbral</span><span class="num">${nf2.format(AP.policy.approval_threshold)} MXNe</span></li>
        <li><span>Pago en el contrato</span><span class="num">#${esc(AP.id)}</span></li>
        <li><span>Destino</span><span><a href="${EXPL}/account/${esc(s.address)}" target="_blank" rel="noopener">${esc(s.address.slice(0, 6))}…${esc(s.address.slice(-4))}</a></span></li>
      </ul>
      <p class="why">Al aprobar, tu llave de director firma la función <b>approve</b> del contrato y los fondos salen de la bóveda directo al proveedor. Nadie más puede liberarlos.</p>
    </section>
    <div class="actions">
      <button class="btn primary" id="ok">Aprobar pago</button>
      <button class="btn" id="no">Rechazar</button>
    </div>`;
  $('#ok').onclick = () => decide('approve');
  $('#no').onclick = () => decide('reject');
}

function fraudView(s) {
  $('#main').innerHTML = `
    <h1>Alerta de posible fraude</h1>
    <p class="sub">Alguien pidió pagarle a ${esc(s.name)} en una cuenta nueva. El contrato ya lo bloqueó: no se movió dinero.</p>
    <section class="card" aria-label="Detalle de la solicitud">
      <span class="pill bad"><span class="d"></span>Cuenta fuera de la lista blanca</span>
      <p class="to" style="margin-top:14px">${esc(s.name)}<span>${esc(s.city)} · RFC ${esc(s.rfc || '')}</span></p>
      <ul class="kv">
        <li><span>Pidió el cambio</span><span class="err">${esc(AP.from_email)}</span></li>
        <li><span>Correo oficial</span><span>${esc(AP.official_email)}</span></li>
        <li><span>Cuenta nueva</span><span>creada hace ${esc(AP.account_age_days)} días</span></li>
        <li><span>Monto en juego</span><span class="num">${nf2.format(AP.amount)} MXNe</span></li>
      </ul>
      <p class="why">Antes de autorizar, llama al proveedor <b>al teléfono que ya tenías</b>, no al que viene en el correo. Si autorizas, tu llave de director agrega la cuenta nueva a la lista blanca del contrato.</p>
    </section>
    <div class="actions">
      <button class="btn primary" id="no">Es fraude: bloquear</button>
      <button class="btn" id="ok">Ya lo confirmé: autorizar cuenta</button>
    </div>`;
  $('#ok').onclick = () => decide('approve');
  $('#no').onclick = () => decide('reject');
}

async function decide(decision) {
  const btn = decision === 'approve' ? $('#ok') : $('#no');
  $('#ok').disabled = $('#no').disabled = true;
  btn.innerHTML = decision === 'approve' ? '<span class="spin"></span>Firmando en Stellar…' : (AP.type === 'supplier_change' ? 'Bloqueando…' : 'Rechazando…');
  if (navigator.vibrate) navigator.vibrate(12);
  const t0 = performance.now();
  const r = await fetch('/api/approve', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, t, decision})});
  const j = await r.json();
  if (!r.ok || !j.ok) { btn.textContent = 'Reintentar'; $('#ok').disabled = $('#no').disabled = false; let er = $('#err'); if (!er) { er = document.createElement('p'); er.id = 'err'; er.setAttribute('role', 'alert'); er.style.cssText = 'margin:12px 0 0;color:#b42318;font-size:14px'; btn.parentNode.after(er); }
    er.textContent = j.error || 'No se pudo completar. Intenta de nuevo.'; return; }
  done({decision, j, secs: ((performance.now() - t0) / 1000).toFixed(1)});
}

function done({decision, j, secs, already}) {
  const ok = decision === 'approve' || already === 'aprobada';
  const s = AP.supplier_info;
  if (AP.type === 'supplier_change') {
    $('#main').innerHTML = `<h1>${ok ? 'Cuenta autorizada' : 'Fraude evitado'}</h1>
      <p class="sub">${ok ? 'La cuenta nueva quedó en la lista blanca del contrato.' : `La cuenta nueva de ${esc(s.name)} sigue bloqueada. Avísale al proveedor y a tu banco.`}</p>
      <section class="card done"><span class="pill ${ok ? 'ok' : 'ok'}"><span class="d"></span>${ok ? 'Firmado en Stellar' : 'No se movió dinero'}</span>
      <div class="fig num">${nf2.format(AP.amount)}<small>MXNe protegidos</small></div><p class="to">${esc(s.name)}</p></section>
      <div class="actions">${j && j.hash ? `<a class="btn primary" href="${EXPL}/tx/${esc(j.hash)}" target="_blank" rel="noopener">Ver firma en el ledger</a>` : ''}</div>`;
    return;
  }
  $('#main').innerHTML = `
    <h1>${ok ? 'Pago liberado' : 'Pago rechazado'}</h1>
    <p class="sub">${already ? 'Esta solicitud ya estaba resuelta.' : ok ? `Liquidado en Stellar en ${secs} segundos.` : 'Los fondos siguen en la bóveda.'}</p>
    <section class="card done">
      <span class="pill ${ok ? 'ok' : 'bad'}"><span class="d"></span>${ok ? 'Liquidado' : 'Rechazado'}</span>
      <div class="fig num">${nf2.format(AP.amount)}<small>MXNe</small></div>
      <p class="to">${esc(s.name)}<span>${esc(AP.concept)}</span></p>
    </section>
    <div class="actions">${j && j.hash ? `<a class="btn primary" href="${EXPL}/tx/${esc(j.hash)}" target="_blank" rel="noopener">Ver comprobante en el ledger</a>` : ''}</div>`;
  if (ok && navigator.vibrate) navigator.vibrate([20, 40, 20]);
}
init();
</script>
</body>
</html>
